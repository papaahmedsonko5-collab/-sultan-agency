<!DOCTYPE html>
<!-- Gabarit de l'image de partage (og-image.png, 1200 x 630). Rendu par capture d'écran. -->
<html lang="fr"><head><meta charset="UTF-8"><link rel="stylesheet" href="../style.css">
<style>
body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0d0c0b}
.og{position:relative;width:1200px;height:630px;padding:56px 60px;box-sizing:border-box}
.og .logo{position:absolute;left:60px;top:52px}
.og h1{position:absolute;left:56px;top:150px;font-size:132px;font-stretch:62%;line-height:.84;color:#f4efe6}
.og h1 span{display:block}
.og h1 .it{color:#c9a24a;font-size:.9em}
.og .live{position:absolute;left:60px;bottom:52px}
.og .ph{position:absolute;right:60px;top:52px;width:330px;height:526px;object-fit:cover}
.og .st{position:absolute;right:330px;top:300px;width:170px;height:226px;object-fit:cover;border:6px solid #0d0c0b}
</style></head><body>
<div class="og">
  <span class="logo"><span class="logo-mark">SA</span><span class="logo-word">Sultan Agency<small>Événements · Création · Dakar</small></span></span>
  <h1><span>Vivre,</span><span>partager,</span><span class="it">vibrer.</span></h1>
  <p class="live">Agence événementielle &amp; créative · Dakar, Sénégal</p>
  <img class="ph" src="../images/scenes/scene-artiste.jpg" alt="">
  <img class="st" src="../images/scenes/nouvel-an-scene.jpg" alt="">
</div></body></html>
